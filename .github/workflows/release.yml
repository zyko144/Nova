name: Build and publish Nova Browser
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install dependencies
        run: python -m pip install -r browser/requirements.txt
      - name: Validate release version
        run: |
          $version = python -c "import sys;sys.path.insert(0,'browser');from version import VERSION;print(VERSION)"
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag and app version differ' }
          "NOVA_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run account and updater tests
        run: |
          python sync-server/test_server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s browser/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable browser
        run: ./browser/build.ps1
      - name: Smoke test packaged browser
        run: |
          $process = Start-Process browser/dist/NovaBrowser/NovaBrowser.exe -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(45000)) { Stop-Process -Id $process.Id; throw 'Smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged browser failed' }
      - name: Package release
        run: |
          Compress-Archive -Path browser/dist/NovaBrowser/* -DestinationPath NovaBrowser-Windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash NovaBrowser-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NovaBrowser-Windows-x64.zip" | Set-Content SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:NOVA_RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:NOVA_RELEASE_TAG NovaBrowser-Windows-x64.zip SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:NOVA_RELEASE_TAG NovaBrowser-Windows-x64.zip SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --title "Nova Browser $env:NOVA_RELEASE_TAG" --notes-file CHANGELOG.md --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
