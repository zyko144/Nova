services:
  api:
    build: .
    restart: unless-stopped
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NOVA_PUBLIC_ORIGIN: https://${NOVA_DOMAIN}
      GOOGLE_DESKTOP_CLIENT_ID: ${GOOGLE_DESKTOP_CLIENT_ID:-54433304112-0h0sotfg4l7ql274mk9l5grjg1bhgjj1.apps.googleusercontent.com}
    volumes:
      - nova-data:/data
    expose:
      - "8766"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  https:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NOVA_DOMAIN: ${NOVA_DOMAIN:?Définir NOVA_DOMAIN dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
volumes:
  nova-data:
  caddy-data:
  caddy-config:
